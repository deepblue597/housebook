# Dependency updates (milestone 13, D50): one pull request per ecosystem per week for minor and
# patch updates together, a separate one for each major update. Each runs the full CI like any
# other pull request; merge when it is green.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm # pnpm-lock.yaml is understood too
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    groups:
      web:
        update-types: [minor, patch]
    open-pull-requests-limit: 10
    ignore:
      # three.js stays on 0.182 until react-three-fiber 10 is stable: r3f 9.x still creates a
      # THREE.Clock, which three 0.183+ reports as deprecated on every 3D load (apps/web/README.md,
      # e2e test M2-04). Upgrade both together, by hand.
      - dependency-name: three
        versions: ['>=0.183.0']
      - dependency-name: '@types/three'
        versions: ['>=0.183.0']

  # Base images in the Dockerfile. Security fixes in them reach users only through a new
  # release. Node stays on its LTS line (24) and Python is set by an ARG (not updated here):
  # both are changed by hand, together with CI and CONTRIBUTING.md.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      images:
        update-types: [minor, patch]
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
